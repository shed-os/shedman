name: ci
on:
  push:
    branches: [main]
  pull_request:
# The build pushes the pkgrel bump back here when a release is already
# published, and a reusable workflow cannot grant itself the write.
permissions:
  contents: write
jobs:
  pipeline:
    uses: shed-os/shedos-ci/.github/workflows/package-pipeline.yml@main
    with:
      packages: '["."]'
      # The suites run the verbs rather than mocking them, so the container
      # needs what the verbs import and shell out to. zsh, fish, scdoc and
      # man-db are what the completions and man suites check their files
      # with, and a suite that cannot find them bows out instead of running.
      # Two packages carry files this repo does not own and the suites reach:
      # shedos-system holds the DKMS helper the doctor audit asks and the one
      # writer of the pacman blocks that apply hands its plan to, and the theme
      # engine holds the palette module five of the TUIs import.
      test_packages: >-
        zsh fish scdoc man-db python-textual python-rich python-pygments
        python-tomlkit snapper btrfs-progs lm_sensors smartmontools
        shedos-system shedos-theme-engine
    secrets:
      SHEDOS_DISPATCH_TOKEN: ${{ secrets.SHEDOS_DISPATCH_TOKEN }}
