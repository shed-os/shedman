#
# /etc/pacman.conf
#
[options]
HoldPkg = pacman glibc

[core]
Include = /etc/pacman.d/mirrorlist

# >>> my-mirror <<<
# Managed by shedos-system; do not edit between these markers.
# Declared in /etc/shedos/system.toml; a block for a repository nobody
# declared is reconciled away.
[my-mirror]
SigLevel = Required DatabaseRequired
Server = https://pkgs.example.org/$repo/$arch
# <<< my-mirror >>>
