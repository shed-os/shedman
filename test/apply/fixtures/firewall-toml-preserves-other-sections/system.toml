schema = 1

[systemd.system]
enable = ["snapper-timeline.timer", "snapper-cleanup.timer"]

[systemd.user]
enable = ["shedos-update-check.timer"]

[pacman.repos.shedos]
server = "https://repo.shedos.org/$arch"
siglevel = "Required DatabaseRequired"

[network.firewall]
enabled = true

[[network.firewall.rules]]
action = "allow"
port = 22
proto = "tcp"
comment = "ssh"
